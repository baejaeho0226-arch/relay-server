<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#04110a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>RELAY // Operations Console</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <section id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">&gt;_</div>
      <h1>Relay Control</h1>
      <p class="muted">SECURE OPERATIONS CONSOLE</p>
      <form id="login-form" autocomplete="off">
        <label>Role
          <select id="login-role">
            <option value="admin">Admin</option>
            <option value="operator">Operator</option>
            <option value="viewer">Viewer</option>
          </select>
        </label>
        <label>Password
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary wide" type="submit">로그인</button>
      </form>
      <div id="login-error" class="form-error"></div>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">&gt;_</div>
        <div><strong>RELAY // OPS</strong><span>WEB CONTROL NODE</span></div>
      </div>
      <nav id="nav">
        <button data-view="dashboard" class="active">Dashboard</button>
        <button data-view="console">Live Console</button>
        <button data-view="trace">Request Trace</button>
        <button data-view="monitor">Health Monitor</button>
        <button data-view="terminal">Command Terminal</button>
        <button data-view="distribution">Distribution</button>
        <button data-view="failover" data-admin-only>Emergency Failover</button>
        <button data-view="recovery">Request Recovery</button>
        <button data-view="notifications">Notifications <span id="notification-badge" class="nav-count hidden">0</span></button>
        <button data-view="processors">Number Processing</button>
        <button data-view="reports">Push / Daily Report</button>
        <button data-view="servers">Servers</button>
        <button data-view="clients">Clients</button>
        <button data-view="licenses">Licenses</button>
        <button data-view="releases" data-admin-only>Releases / Updates</button>
        <button data-view="features" data-admin-only>Feature Flags</button>
        <button data-view="confighistory" data-admin-only>Config History</button>
        <button data-view="enrollment" data-admin-only>Device Enrollment</button>
        <button data-view="protocol">Protocol / Security</button>
        <button data-view="security">Security Center</button>
        <button data-view="audit">Audit Log</button>
        <button data-view="activity" data-admin-only>Admin Activity</button>
        <button data-view="sessions" data-admin-only>Sessions</button>
        <button data-view="backups">Backups</button>
        <button data-view="health">System Health</button>
        <button data-view="loadlab" data-admin-only>Load Simulator</button>
        <button data-view="storage" data-admin-only>Storage Migration</button>
        <button data-view="system">System</button>
        <button data-view="danger" data-admin-only class="danger-nav">Danger Zone</button>
      </nav>
      <div class="sidebar-footer">
        <div><span class="muted">Role</span><strong id="role-label">-</strong></div>
        <button id="logout-btn" class="ghost">로그아웃</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="page-title">Dashboard</h2>
          <p id="page-subtitle" class="muted">NODE STATUS / TRAFFIC / CONTROL</p>
        </div>
        <div class="topbar-actions">
          <span id="live-state" class="live-pill">LIVE</span>
          <button id="install-pwa-btn" class="ghost hidden">INSTALL APP</button>
          <button id="refresh-btn" class="ghost">새로고침</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">확인</h3>
        <button class="icon-btn" data-modal-close>×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost">취소</button>
        <button id="modal-confirm" class="primary">확인</button>
      </div>
    </div>
  </div>

  <script src="/admin.js" defer></script>
</body>
</html>
